<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090b">
  <title>Controller - Pet Clicker MVP</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="text-center mb-8 mt-4">
      <h1 class="text-3xl font-bold mb-2">Remote Controller</h1>
      
      <div id="statusIndicator" class="status-indicator status-offline">
        <div class="status-dot"></div>
        <span id="statusText">Connecting...</span>
      </div>
    </div>

    <div class="card" style="padding: var(--spacing-md); margin-bottom: var(--spacing-md);">
      <div class="flex justify-between items-center" style="gap: 1rem;">
        <div>
          <div class="font-bold">Connection Code</div>
          <div class="text-sm text-secondary">Pair with receiver using same code</div>
        </div>
        <input type="text" id="pairingCodeInput" maxlength="6" style="width: 6rem; text-align: center; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: var(--border-radius-md); padding: 0.5rem; font-family: monospace; font-weight: bold; font-size: 1.125rem; text-transform: uppercase; outline: none;" placeholder="0987">
      </div>
    </div>

    <div class="big-button-container">
      <button id="clickBtn" class="big-btn" disabled>
        CLICK
      </button>

      <button id="doubleClickBtn" class="btn mt-4 flex items-center justify-center gap-2" style="font-weight: 600; padding: 0.75rem 1.5rem; border-radius: var(--border-radius-full); max-width: 16rem;" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 0.25rem;"><rect width="14" height="14" x="5" y="5" rx="2" ry="2"/><path d="M9 9h6v6H9z"/></svg>
        DOUBLE CLICK
      </button>

      <p class="mt-8 text-secondary text-sm text-center" style="max-width: 200px;">
        Tap the large button for a single click, or the small button for a double click.
      </p>

      <button id="installAppBtn" class="btn btn-primary mt-8" style="display: none; max-width: 250px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 0.5rem;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Install App
      </button>
    </div>
    
    <button onclick="window.location.href='index.html'" style="position: fixed; bottom: 1rem; right: 1rem; font-size: 0.75rem; color: var(--text-muted); padding: 0.5rem;">
      Change Role
    </button>
  </div>

  <script type="module" src="controller.js"></script>
</body>
</html>
