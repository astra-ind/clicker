<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090b">
  <title>Receiver - Pet Clicker MVP</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
  <div class="container" style="padding-bottom: 5rem;">
    <header>
      <h1 class="text-3xl font-bold">Receiver</h1>
      <div id="statusIndicator" class="status-indicator status-offline">
        <div class="status-dot"></div>
        <span id="statusText">Offline</span>
      </div>
    </header>

    <div class="card" style="text-align: center;">
      <h2 class="text-sm font-bold text-muted mb-2" style="text-transform: uppercase; letter-spacing: 0.05em;">Last Trigger</h2>
      <div id="lastTriggerTime" class="text-3xl font-light" style="font-variant-numeric: tabular-nums;">Never</div>
    </div>

    <div class="card flex flex-col gap-4">
      <div>
        <label class="text-sm font-bold text-secondary flex mb-2">Output Mode</label>
        <div class="segmented-control" id="outputModeGroup">
          <button data-mode="click" class="active">Click</button>
          <button data-mode="vibration">Vibration</button>
          <button data-mode="both">Both</button>
        </div>
      </div>

      <div id="soundProfileContainer">
        <label class="text-sm font-bold text-secondary flex mb-2 mt-4">Sound Profile</label>
        <div class="segmented-control" id="soundProfileGroup">
          <button data-sound="mechanical" class="active">Mechanical</button>
          <button data-sound="soft">Soft</button>
          <button data-sound="loud">Loud</button>
        </div>
      </div>

      <div id="volumeContainer">
        <div class="flex justify-between items-center mb-2 mt-4">
          <label class="text-sm font-bold text-secondary">Volume</label>
          <span id="volumeValue" class="text-sm text-muted">100%</span>
        </div>
        <div class="flex items-center gap-4">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-muted"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-muted"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </div>
      </div>
    </div>

    <div class="card flex justify-between items-center">
      <div>
        <div class="font-bold">Keep Screen Awake</div>
        <div class="text-sm text-secondary">Prevents device from sleeping</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="keepAwakeToggle">
        <span class="slider"></span>
      </label>
    </div>

    <button id="testBtn" class="btn btn-primary mt-4 mb-4">
      Test Output
    </button>
    
    <button id="installAppBtn" class="btn mt-4 mb-4" style="display: none; justify-content: center;">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 0.5rem;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Install App
    </button>
    
    <button onclick="window.location.href='index.html'" style="position: fixed; bottom: 1rem; right: 1rem; font-size: 0.75rem; color: var(--text-muted); padding: 0.5rem;">
      Change Role
    </button>
  </div>

  <script type="module" src="receiver.js"></script>
</body>
</html>
